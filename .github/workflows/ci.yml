name: CI

on:
  # main only. prod is deliberately absent: only main can open a PR into prod
  # (enforced by prod-pr-guard.yml), and anything reaching main has already
  # passed these checks, so running them again on the prod PR and again on the
  # prod push is re-checking identical code three times.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets anyone kick off a test Android build on any branch without waiting
  # for a push to main. APK only — this job has no signing keystore, so an
  # AAB build here would just fail; Play AABs are built only by
  # release-android.yml, which holds the signing secrets.
  workflow_dispatch:
    inputs:
      route:
        description: "App route to build"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - vendor

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks on every push/PR to main. No native build tooling required.
  quality:
    name: "Quality checks (format · lint · typecheck)"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Non-blocking for now — 17 pre-existing high-severity vulnerabilities
      # (mostly in the Expo dependency chain) need real SDK version bumps to
      # resolve, not a quick `npm audit fix`. Flip continue-on-error to false
      # once those are cleared so this actually gates new ones.
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_BUILD_WEBHOOK_URL" ]; then
            echo "No DISCORD_BUILD_WEBHOOK_URL set, skipping notification."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_BUILD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Quality Checks failed** on \`${{ github.ref_name }}\` (${{ github.event_name }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"

  # Manual, on-demand Android APK for any branch — a quick way to sanity
  # check a change without pushing to main. Play publishing lives in
  # release-android.yml.
  test-build:
    name: "Test Android build (${{ github.event.inputs.route }} apk)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free runner disk space
        run: bash scripts/ci-free-runner-disk.sh

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # modules-2 + wrapper only. Caching all of ~/.gradle/caches also pulls in
      # transforms/ and build-cache/, which are several GB, machine-specific,
      # and the usual reason cache.tzst fills the disk.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('app.config.ts', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: Install dependencies
        run: npm ci

      - name: Create production env file for native build
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_SENTRY_DSN_CUSTOMER: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_CUSTOMER }}
          EXPO_PUBLIC_SENTRY_DSN_VENDOR: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_VENDOR }}
          SENTRY_PROJECT_CUSTOMER: ${{ secrets.SENTRY_PROJECT_CUSTOMER }}
          SENTRY_PROJECT_VENDOR: ${{ secrets.SENTRY_PROJECT_VENDOR }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_ENABLE_THEME_SWITCH: ${{ secrets.EXPO_PUBLIC_ENABLE_THEME_SWITCH }}
        run: |
          if [[ -z "$EXPO_PUBLIC_API_BASE_URL" ]]; then
            echo "::error::Missing GitHub Actions secret: EXPO_PUBLIC_API_BASE_URL"
            exit 1
          fi
          cat > .env.prod <<EOF
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_SENTRY_DSN_CUSTOMER=${EXPO_PUBLIC_SENTRY_DSN_CUSTOMER}
          EXPO_PUBLIC_SENTRY_DSN_VENDOR=${EXPO_PUBLIC_SENTRY_DSN_VENDOR}
          SENTRY_PROJECT_CUSTOMER=${SENTRY_PROJECT_CUSTOMER}
          SENTRY_PROJECT_VENDOR=${SENTRY_PROJECT_VENDOR}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          EXPO_PUBLIC_ENABLE_THEME_SWITCH=${EXPO_PUBLIC_ENABLE_THEME_SWITCH}
          EOF

      - name: Build apk
        env:
          # Passed through env instead of interpolated into the script text:
          # ${{ }} substitution happens before the shell runs, so reading the
          # input as a real shell variable is what protects against injection.
          BUILD_ROUTE: ${{ github.event.inputs.route }}
        run: node scripts/build-android.mjs "$BUILD_ROUTE" apk

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "stuqet-${{ github.event.inputs.route }}-test-apk-${{ github.sha }}"
          path: local-builds/android/**/*.apk
          retention-days: 7

      - name: Trim Gradle cache before post-job save
        if: always()
        continue-on-error: true
        run: bash scripts/ci-trim-gradle-cache.sh
