name: CI — Dev Branch Checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  # Allow anyone to manually kick off a test APK/AAB build on any branch
  workflow_dispatch:
    inputs:
      route:
        description: "App route to build"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - vendor
      artifact:
        description: "Artifact type (apk = direct install, aab = Play Store format)"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Fast quality checks — runs on every push/PR to dev and main
  # Completes in ~1 minute. No native build tooling required.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: "Quality Checks (lint · format · typecheck)"
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    # Self-hosted: if the runner is offline/busy this job just sits "Queued"
    # on the PR with no automatic failure and no notification. This bounds
    # that wait so a dead runner surfaces as a fast, visible red X instead.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # _publish-android.yml is the only place Play Store / signing secrets
      # are touched, and it is only reachable via workflow_call from
      # handle-release-approval.yml -- see that file's header comment. If
      # anyone ever adds a workflow_dispatch, push, or pull_request trigger
      # back onto it (even for something that looks harmless, like "a quick
      # manual test trigger"), the entire two-person release-approval gate
      # becomes a no-op: there's a second, direct door to those secrets
      # that skips approval, and nothing else here would turn red to say
      # so. This is that alarm. It must stay a hard failure, never
      # continue-on-error.
      - name: Guard release-publish workflow trigger
        run: |
          file=".github/workflows/_publish-android.yml"
          # Only lines indented exactly 2 spaces directly under "on:" --
          # NOT nested keys like "inputs:"/"route:" inside workflow_call's
          # own definition, which sit 4+ spaces deep and must not be
          # mistaken for sibling triggers.
          triggers="$(awk '/^on:/{flag=1; next} /^[a-zA-Z]/{flag=0} flag && /^  [a-zA-Z_]+:/{print}' "$file" | sed 's/^  //;s/:.*//')"

          if [[ "$triggers" != "workflow_call" ]]; then
            echo "::error::$file must have ONLY 'workflow_call' as a trigger. Found: $(echo "$triggers" | tr '\n' ' ')"
            echo "::error::This file gates real Play Store publish access. Any other trigger (workflow_dispatch, push, pull_request) creates a direct path to release secrets that skips the required two-person approval in handle-release-approval.yml."
            exit 1
          fi

          echo "$file has exactly one trigger: workflow_call. Release-publish gate is intact."

      # Non-blocking for now — 17 pre-existing high-severity vulnerabilities
      # (mostly in the Expo dependency chain) need real SDK version bumps to
      # resolve, not a quick `npm audit fix`. Flip continue-on-error to false
      # once those are cleared so this actually gates new ones.
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_BUILD_WEBHOOK_URL" ]; then
            echo "No DISCORD_BUILD_WEBHOOK_URL set, skipping notification."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_BUILD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Quality Checks failed** on \`${{ github.ref_name }}\` (${{ github.event_name }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Manual test build — only runs when triggered via workflow_dispatch
  # Use this when you want a real APK/AAB without waiting on EAS or your laptop.
  # ─────────────────────────────────────────────────────────────────────────────
  build-android-test:
    name: "Test Build — Android ${{ github.event.inputs.route }} (${{ github.event.inputs.artifact }})"
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    # Only execute this job when manually triggered, not on every push
    if: github.event_name == 'workflow_dispatch'
    # Quality checks must pass before we spend time on a native build
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Cache Gradle dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app.config.ts', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node dependencies
        run: npm ci

      - name: Create production env file for native build
        run: |
          cat > .env.prod <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_SENTRY_DSN_CUSTOMER=${{ secrets.EXPO_PUBLIC_SENTRY_DSN_CUSTOMER }}
          EXPO_PUBLIC_SENTRY_DSN_VENDOR=${{ secrets.EXPO_PUBLIC_SENTRY_DSN_VENDOR }}
          SENTRY_PROJECT_CUSTOMER=${{ secrets.SENTRY_PROJECT_CUSTOMER }}
          SENTRY_PROJECT_VENDOR=${{ secrets.SENTRY_PROJECT_VENDOR }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_ENABLE_THEME_SWITCH=${{ secrets.EXPO_PUBLIC_ENABLE_THEME_SWITCH }}
          EOF

      - name: Run Android build script
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT_CUSTOMER: ${{ secrets.SENTRY_PROJECT_CUSTOMER }}
          SENTRY_PROJECT_VENDOR: ${{ secrets.SENTRY_PROJECT_VENDOR }}
          # Passed through env instead of interpolated directly into the
          # script text below: ${{ }} substitution happens before the shell
          # ever runs, so quoting the input inline doesn't protect against
          # injection the way reading it as a real shell variable does -
          # this runs on our own self-hosted runner, not a throwaway one.
          BUILD_ROUTE: ${{ github.event.inputs.route }}
          BUILD_ARTIFACT: ${{ github.event.inputs.artifact }}
        run: |
          node scripts/build-android.mjs \
            "$BUILD_ROUTE" \
            "$BUILD_ARTIFACT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact is named so you can tell exactly what it is from the Actions UI
          name: "stuqet-${{ github.event.inputs.route }}-${{ github.event.inputs.artifact }}-${{ github.sha }}"
          path: local-builds/android/**/*.${{ github.event.inputs.artifact }}
          # Keep test builds for 14 days to avoid storage bloat
          retention-days: 14
