name: Cleanup — Caches for a Closed PR

# GitHub scopes each cache to the branch/ref that created it -- a PR branch
# gets its own copy of every cache key, even ones that look identical to a
# cache already sitting on dev/main. cleanup-actions-caches.yml only deletes
# by age, so an actively-worked PR never qualifies (its caches keep getting
# touched), and once merged, that PR's caches become dead weight that just
# sits there until the age-based sweep eventually catches up -- which is
# how duplicate copies of one cache key pile up and eat the storage quota. This deletes a PR's caches the
# moment the PR closes (merged or not), so duplicates never get the chance
# to accumulate in the first place.
#
# This is GitHub's own documented pattern for this exact problem:
# https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
#
# Known gap: this only covers caches scoped to a PR ref
# (refs/pull/<number>/merge). Caches created by a direct push to a
# long-lived branch (dev/main) aren't touched here -- those are still
# handled by cleanup-actions-caches.yml's age-based sweep.

on:
  pull_request:
    types:
      - closed

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete this PR's caches
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
      - name: Delete caches scoped to this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          echo "Deleting caches scoped to ${PR_REF}"

          gh api "repos/${REPO}/actions/caches?ref=${PR_REF}&per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .key] | @tsv' \
            | while IFS=$'\t' read -r cache_id cache_key; do
                echo "Deleting cache '${cache_key}' (id ${cache_id})"
                gh api -X DELETE "repos/${REPO}/actions/caches/${cache_id}" || true
              done

          echo "Cleanup complete."
