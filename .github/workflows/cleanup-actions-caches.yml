name: Cleanup — Stale Actions Caches

# Gradle cache keys are content-based (see the Gradle cache steps in
# dev-android-apk-distribution.yml, release-android.yml, and ci.yml). Every
# key that stops matching current content becomes orphaned -- GitHub never
# deletes it on its own, it only evicts caches once the repository's total
# hits its storage cap. Left alone, orphaned caches just accumulate quietly
# until that eviction kicks in. This runs weekly and removes anything past a
# fixed age instead of waiting for that.

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday, 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete caches older than this many days"
        required: true
        default: "14"
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete caches older than the retention window
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}

    steps:
      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '14' }}
        run: |
          cutoff_epoch="$(date -u -d "-${MAX_AGE_DAYS} days" +%s)"

          echo "Deleting caches last accessed before $(date -u -d "@$cutoff_epoch" -Iseconds) (older than ${MAX_AGE_DAYS} days)."

          gh api "repos/${REPO}/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .key, .last_accessed_at] | @tsv' \
            | while IFS=$'\t' read -r cache_id cache_key last_accessed; do
                last_accessed_epoch="$(date -u -d "$last_accessed" +%s)"
                if [[ "$last_accessed_epoch" -lt "$cutoff_epoch" ]]; then
                  echo "Deleting cache '${cache_key}' (id ${cache_id}, last accessed ${last_accessed})"
                  gh api -X DELETE "repos/${REPO}/actions/caches/${cache_id}" || true
                fi
              done

          echo "Cleanup complete."
