name: Security — Secret scan

# Scans every push/PR to main for accidentally committed secrets (API keys,
# tokens, credentials) using Gitleaks, plus a weekly scheduled sweep so a leak
# sitting in history doesn't just wait for the next push.
#
# prod is deliberately absent: it only ever receives main (prod-pr-guard.yml),
# so the scan already ran on every commit that reaches it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # 15 min -- gitleaks scans full history, not just the diff.
    timeout-minutes: 15
    # Default GITHUB_TOKEN permissions here don't include pull-requests:read,
    # which gitleaks-action needs to look up the PR's commit range on
    # pull_request-triggered runs (GET /pulls/{pr}/commits) -- without this it
    # 403s. contents:read covers the checkout itself.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Gitleaks scans history, not just the working tree — needs full
          # depth or it can only see the most recent commit.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for org-owned repos (this one is under
          # Stuqet) — free key from https://gitleaks.io.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # We don't need the SARIF artifact -- the pass/fail check result
          # and step logs are what actually gate the PR.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_BUILD_WEBHOOK_URL" ]; then
            echo "No DISCORD_BUILD_WEBHOOK_URL set, skipping notification."
            exit 0
          fi
          curl -sf -X POST "$DISCORD_BUILD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Gitleaks failed** on \`${{ github.ref_name }}\` (${{ github.event_name }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"
