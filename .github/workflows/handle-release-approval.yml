name: Release — 2. Approve & publish

# This is the ONLY place in the repo allowed to trigger _publish-android.yml
# (which has no trigger of its own -- see its header comment). Fires on
# every PR review submitted anywhere in the repo; everything below exists
# to narrow that down to exactly one thing: a named, authorized, different
# person clicking "Approve" on a genuine release-request PR.
on:
  pull_request_review:
    types: [submitted]

jobs:
  verify-approval:
    name: Verify release approval
    # Three conditions, all required, checked here at the job level so an
    # unrelated PR review anywhere else in the repo never even starts this:
    #   1. The PR being reviewed targets release-gate (nothing else does).
    #   2. The review is an actual approval, not a comment or change request.
    #   3. The PR was opened by our own automation (github-actions[bot]),
    #      not by a human directly. This is the fix for the gap caught
    #      while designing this: without it, anyone with write access could
    #      open their own PR into release-gate with a fabricated metadata
    #      file claiming any "requested_by" name they like, then approve
    #      it themselves -- the self-approval check below only means
    #      anything if the file it's reading was honestly written by our
    #      own script, which only ever happens on a bot-authored PR.
    if: >-
      github.event.pull_request.base.ref == 'release-gate' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      route: ${{ steps.check.outputs.route }}
      track: ${{ steps.check.outputs.track }}
      requested_by: ${{ steps.check.outputs.requested_by }}
    steps:
      # Reviewer identity check, self-approval check, and reading the
      # request's actual route/track -- all in one step so a single
      # ordered narrative is easy to audit later, rather than splitting
      # trust decisions across several steps' outputs.
      - name: Check reviewer identity and self-approval
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVER: ${{ github.event.review.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Kept as a hardcoded list here, deliberately not read live from
          # .github/CODEOWNERS at runtime: a CODEOWNERS edit must never be
          # able to silently change who can approve a real Play Store
          # release without a human also deciding that, on purpose, in
          # this workflow file -- which itself requires the same approval
          # this file exists to enforce (or, right now with no branch
          # protection, at minimum leaves a visible diff for someone to
          # notice on review).
          # TODO: list the GitHub usernames allowed to approve a release, e.g.
          #   allowed_approvers=("octocat" "hubot")
          # Left empty on purpose: with no approvers every approval is ignored,
          # so no release can be published until this is set. Fail closed.
          allowed_approvers=()

          is_allowed=false
          for name in "${allowed_approvers[@]}"; do
            if [[ "$APPROVER" == "$name" ]]; then
              is_allowed=true
            fi
          done

          if [[ "$is_allowed" != "true" ]]; then
            echo "::error::@$APPROVER is not an authorized release approver."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "@$APPROVER's approval was recorded but ignored — not one of the authorized release approvers in .github/CODEOWNERS. This request is still waiting on an authorized approval."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Filtered by path, NOT taken as the first file in the diff.
          # release-gate is a static branch that was only ever synced to
          # dev once, at creation -- every commit merged to dev since
          # then shows up as "changed" when this PR (branched from a
          # recent dev) is diffed against that stale base. Taking
          # .[0].filename blindly picked up whatever unrelated file
          # sorted first (it can grab an unrelated file such as
          # .github/CODEOWNERS and fail to parse it as the request JSON). --paginate: with
          # release-gate this stale, the diff can exceed one page of the
          # files endpoint's default 30-per-page limit, and the real
          # target file is not guaranteed to sort onto page 1.
          request_file="$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --jq '.[] | select(.filename | startswith("release-requests/")) | .filename' | head -n1)"
          if [[ -z "$request_file" ]]; then
            echo "::error::Could not find the release-request metadata file on this PR."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "⚠️ Could not read a release-request metadata file from this PR — not proceeding. If this PR wasn't opened by the release workflow, that's expected."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          request_json="$(gh api "repos/${{ github.repository }}/contents/$request_file?ref=$HEAD_SHA" --jq '.content' | base64 --decode)"
          route="$(jq -r '.route' <<< "$request_json")"
          track="$(jq -r '.track' <<< "$request_json")"
          requested_by="$(jq -r '.requested_by' <<< "$request_json")"

          if [[ -z "$route" || -z "$track" || -z "$requested_by" || "$route" == "null" || "$track" == "null" || "$requested_by" == "null" ]]; then
            echo "::error::Release-request metadata file is missing required fields."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "⚠️ The release-request metadata file is malformed (missing route/track/requested_by) — not proceeding. Fail closed, not open."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$APPROVER" == "$requested_by" ]]; then
            echo "::error::@$APPROVER cannot approve their own release request."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "@$APPROVER — you requested this release, so your own approval doesn't count. A *different* authorized approver needs to approve this."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "requested_by=$requested_by" >> "$GITHUB_OUTPUT"

  # The only job in this whole system allowed to reach the real publish
  # workflow. `uses:` -- not workflow_dispatch, not an API call -- is how
  # a reusable workflow is invoked; see _publish-android.yml's header
  # comment for why nothing else can start it.
  #
  # Referenced explicitly by repo + ref (@dev), NOT as a relative
  # "./.github/workflows/_publish-android.yml" path. Found by actually
  # testing this, not by reading the YAML: pull_request_review events
  # resolve a relative reusable-workflow path against the pull request's
  # own merge ref, not against the ref this calling workflow runs from.
  # Since release-gate PRs' base branch is a frozen snapshot that never
  # has this file, that resolution failed outright (startup_failure,
  # zero jobs scheduled). Pinning
  # to @dev makes the lookup unambiguous: always the version of
  # _publish-android.yml currently reviewed and merged to dev, which is
  # also the correct trust anchor -- this is first-party code already
  # under the same CODEOWNERS protection as every other workflow file,
  # not a third-party supply-chain concern needing a SHA pin.
  publish:
    name: Publish approved release
    needs: verify-approval
    if: needs.verify-approval.outputs.approved == 'true'
    # Must be this repository's own path (owner/repo) -- GitHub does not allow a
    # variable in `uses:`. Update it if the repository is renamed or moved.
    uses: Cyfamod-Technologies/stuqet-mobile/.github/workflows/_publish-android.yml@dev
    # A reusable workflow's job permissions are capped by whatever the
    # calling job declares -- they can't grant more than the caller has,
    # regardless of what the called workflow's own job requests. Found
    # live: GitHub rejected the workflow outright ("The nested job
    # 'publish' is requesting 'actions: write, contents: write', but is
    # only allowed 'actions: none, contents: read'") because this job had
    # no permissions block, so it fell back to the repo's read-only
    # default. Must match or exceed what _publish-android.yml's own
    # `publish` job needs.
    permissions:
      contents: write
      actions: write
    with:
      route: ${{ needs.verify-approval.outputs.route }}
      track: ${{ needs.verify-approval.outputs.track }}
      requested_by: ${{ needs.verify-approval.outputs.requested_by }}
      approved_by: ${{ github.event.review.user.login }}
      gate_pr_url: ${{ github.event.pull_request.html_url }}
    secrets: inherit

  close-gate-pr:
    name: Close release-request PR
    needs: [verify-approval, publish]
    # always(): must still run and report even if `publish` genuinely
    # failed (not skipped) -- an approved-but-broken release must not be
    # able to leave the gate PR silently open with no explanation.
    if: always() && needs.verify-approval.outputs.approved == 'true'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      # Needed by `gh pr close --delete-branch` on the success path. Without
      # it the branch delete returns HTTP 403 "Resource not accessible by
      # integration" and fails the job after the PR has already closed.
      contents: write
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.publish.result }}
          APPROVER: ${{ github.event.review.user.login }}
        run: |
          # Only a successful publish retires the request. A failed one leaves
          # the PR open and the branch intact on purpose: the approval itself
          # was valid, and the failure is usually infrastructure (the first
          # real release build died on runner disk space, not on anything
          # about the request). Closing on failure burned a legitimate
          # two-person approval and forced the whole request cycle again.
          #
          # Leaving it open keeps two safe retry routes, neither of which can
          # publish anything that was not already approved:
          #   - Re-run this failed run: it replays the same review event and
          #     the same commit, so verify-approval re-checks the same
          #     approver against the same requester. Requires the branch to
          #     still exist, which is why it is not deleted here.
          #   - Submit a fresh approval on the still-open PR, which fires a
          #     new pull_request_review and runs the full gate again.
          # Either way publish stays behind verify-approval, so this is not a
          # way around the gate -- only a way to retry what passed it.
          if [[ "$RESULT" == "success" ]]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "✅ Approved by @$APPROVER. Publish completed successfully."
            gh pr close "$PR_NUMBER" --repo "${{ github.repository }}" --delete-branch
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "⚠️ Approved by @$APPROVER, but the publish job did not succeed (result: \`$RESULT\`). Nothing was published.

          **This PR is deliberately left open and the branch kept**, because the approval itself was valid — the failure is almost always infrastructure, not the request. You do not need to raise a new release request.

          Two ways to retry, both of which re-run the full approval gate:
          - **Re-run the failed run** ([Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) → *Re-run failed jobs*) — replays this same approval and the same commit, so it can only publish exactly what was already approved.
          - **Submit a fresh approval** on this PR, which starts the gate again from scratch.

          Fix the underlying failure first — check the run log above."
            echo "::notice::Publish failed ($RESULT). PR #$PR_NUMBER left open and branch retained so the existing approval can be retried."
          fi
