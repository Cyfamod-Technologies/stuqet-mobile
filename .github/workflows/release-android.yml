name: Release — Build & Publish Android

# One manual workflow for everything Android that touches Google Play: it
# validates secrets and signing, builds the signed AAB, and uploads it to the
# Play track you pick, for Stuqet Customer, Stuqet Vendor, or both.
#
# There is no request/approval step. "Code merged" and "this app gets uploaded
# to Play" are still deliberately different events — nothing here runs on a
# push or a PR — but the person who clicks Run workflow is the one releasing.
#
# Preflight used to run on every PR. It no longer does: only main can open a PR
# into prod (enforced by prod-pr-guard.yml) and main is already CI-green, so a
# PR run was re-checking checked code. The credential/signing/Play-auth
# validation it provided is not lost: the preflight job runs on every dispatch,
# ahead of every real release, and can be run on its own with preflight_only.
on:
  workflow_dispatch:
    inputs:
      route:
        description: "Which app to release"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - vendor
          - both
      track:
        description: "Google Play track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      preflight_only:
        description: "Validate secrets, the upload-key fingerprint and Play auth without building or submitting"
        required: true
        default: false
        type: boolean
      skip_publish:
        description: "Build the signed AAB and keep it as a run artifact, but do not upload it to Play"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-android-${{ github.ref }}
  # Both apps read Play's highest versionCode before building. Never cancel a
  # release after it may have published.
  cancel-in-progress: false

jobs:
  # Runs on every dispatch, including ahead of every real release — it always
  # precedes the actual build. Kept deliberately cheap — no Android SDK or
  # Gradle here — so credential breakage surfaces in about a minute rather
  # than partway into the real build below. With route=both it runs for both
  # apps first, so a broken credential for one app stops the release of the
  # other before anything is published.
  preflight:
    name: "Preflight — ${{ matrix.app.route }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.route == 'both' && '[{"route":"customer","key":"CUSTOMER"},{"route":"vendor","key":"VENDOR"}]' || inputs.route == 'vendor' && '[{"route":"vendor","key":"VENDOR"}]' || '[{"route":"customer","key":"CUSTOMER"}]') }}

    steps:
      # Only a real release (preflight_only unchecked) is restricted to prod —
      # a preflight_only dispatch can still run from any branch, since it
      # builds and publishes nothing. The `release` job below `needs:
      # [preflight]`, so failing here also prevents it from running at all;
      # this is deliberately a loud failure rather than a silent skip, so
      # dispatching from the wrong branch by mistake is obvious.
      - name: Restrict real releases to the prod branch
        if: ${{ inputs.preflight_only != true }}
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/prod" ]]; then
            echo "::error::A real release (preflight_only unchecked) can only be dispatched from the prod branch. This run was dispatched from '${{ github.ref_name }}'. Re-run with prod selected as the branch, or check preflight_only to just validate secrets/signing from here."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required release secrets
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets[format('EXPO_PUBLIC_SENTRY_DSN_{0}', matrix.app.key)] }}
          SENTRY_PROJECT: ${{ secrets[format('SENTRY_PROJECT_{0}', matrix.app.key)] }}
          PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets[format('ANDROID_UPLOAD_KEYSTORE_BASE64_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets[format('ANDROID_UPLOAD_STORE_PASSWORD_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets[format('ANDROID_UPLOAD_KEY_ALIAS_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets[format('ANDROID_UPLOAD_KEY_PASSWORD_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_SHA1: ${{ vars[format('ANDROID_UPLOAD_SHA1_{0}', matrix.app.key)] }}
          APP_KEY: ${{ matrix.app.key }}
        run: |
          # Report names with the per-app suffix so the missing secret is
          # findable by the name it actually has in repository settings.
          declare -A secret_names=(
            [EXPO_PUBLIC_API_BASE_URL]=EXPO_PUBLIC_API_BASE_URL
            [SENTRY_AUTH_TOKEN]=SENTRY_AUTH_TOKEN
            [EXPO_PUBLIC_SENTRY_DSN]="EXPO_PUBLIC_SENTRY_DSN_${APP_KEY}"
            [SENTRY_PROJECT]="SENTRY_PROJECT_${APP_KEY}"
            [PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON]=PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON
            [ANDROID_UPLOAD_KEYSTORE_BASE64]="ANDROID_UPLOAD_KEYSTORE_BASE64_${APP_KEY}"
            [ANDROID_UPLOAD_STORE_PASSWORD]="ANDROID_UPLOAD_STORE_PASSWORD_${APP_KEY}"
            [ANDROID_UPLOAD_KEY_ALIAS]="ANDROID_UPLOAD_KEY_ALIAS_${APP_KEY}"
            [ANDROID_UPLOAD_KEY_PASSWORD]="ANDROID_UPLOAD_KEY_PASSWORD_${APP_KEY}"
            [ANDROID_UPLOAD_SHA1]="ANDROID_UPLOAD_SHA1_${APP_KEY} (repository variable)"
          )

          missing=0
          for name in "${!secret_names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret or variable: ${secret_names[$name]}"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          case "$EXPO_PUBLIC_API_BASE_URL" in https://*) ;; *) echo "::error::EXPO_PUBLIC_API_BASE_URL must start with https://"; exit 1 ;; esac
          case "$EXPO_PUBLIC_SENTRY_DSN" in https://*) ;; *) echo "::error::EXPO_PUBLIC_SENTRY_DSN_${APP_KEY} must start with https://"; exit 1 ;; esac

          # A non-empty check cannot tell a mis-pasted JSON credential apart.
          # The Play publisher service-account key is a JSON blob downloaded
          # from a Google console; checking its shape costs milliseconds and
          # catches a bad paste here instead of partway through a long native
          # build. Only pass/fail is printed; the value is never echoed.
          if ! printf '%s' "$PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON is not valid JSON. Paste the file contents raw -- not quoted, escaped, or base64-encoded."
            exit 1
          fi
          if ! printf '%s' "$PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | type == "string")' >/dev/null 2>&1; then
            echo "::error::PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON is not a Google service-account key (expected type=service_account with client_email and private_key)."
            exit 1
          fi
          echo "All required secrets are present and well-formed."

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Verify Android upload key fingerprint — ${{ matrix.app.route }}
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets[format('ANDROID_UPLOAD_KEYSTORE_BASE64_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets[format('ANDROID_UPLOAD_STORE_PASSWORD_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets[format('ANDROID_UPLOAD_KEY_ALIAS_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_SHA1: ${{ vars[format('ANDROID_UPLOAD_SHA1_{0}', matrix.app.key)] }}
          ROUTE: ${{ matrix.app.route }}
        run: |
          keystore_path="$RUNNER_TEMP/stuqet-${ROUTE}-upload-key-check.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          keytool_output="$(keytool -list -v \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS")"

          if ! grep -Fq "SHA1: $ANDROID_UPLOAD_SHA1" <<< "$keytool_output"; then
            echo "::error::${ROUTE} upload key SHA1 does not match Play Console's expected SHA1."
            echo "::error::Expected SHA1: $ANDROID_UPLOAD_SHA1"
            echo "$keytool_output" | grep -E "SHA1:|Alias name:"
            exit 1
          fi

          echo "${ROUTE} upload key fingerprint matches expected SHA1."

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm ci

      # Read-only Play Console API call, so an auth/permission break surfaces
      # before the real release build.
      - name: Check Play Console access — ${{ matrix.app.route }}
        env:
          PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
          ROUTE: ${{ matrix.app.route }}
          TRACK: ${{ inputs.track }}
        run: |
          version_code="$(node scripts/get-play-version-code.mjs "com.stuqet.${ROUTE}" "$TRACK")"
          echo "Highest existing Play Console versionCode for com.stuqet.${ROUTE}: $version_code"

      - name: Notify Discord — failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          NOTIFY_MODE: failure
          IS_PREFLIGHT: "true"
          ROUTE: ${{ matrix.app.route }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_URL: ""
          SHORT_SHA: ${{ github.sha }}
        run: python3 scripts/notify-release-discord.py

  # Only runs on a dispatch with preflight_only left unchecked, and only from
  # the prod branch — needs: [preflight] already enforces this (that job fails
  # loudly and stops here if dispatched from elsewhere); the ref check here is
  # defence in depth against this job's condition being evaluated independently
  # of that failure.
  release:
    name: "Release build — ${{ matrix.app.route }}"
    needs: [preflight]
    if: ${{ inputs.preflight_only != true && github.ref == 'refs/heads/prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Checkout needs read access; artifact deletion needs actions write.
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.route == 'both' && '[{"route":"customer","key":"CUSTOMER"},{"route":"vendor","key":"VENDOR"}]' || inputs.route == 'vendor' && '[{"route":"vendor","key":"VENDOR"}]' || '[{"route":"customer","key":"CUSTOMER"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # A release AAB (expo prebuild --clean, R8, a JS bundle) needs far more
      # headroom than a dev APK. The first release build to ever reach this
      # point on a stock runner died with "No space left on device" at 3.6G
      # remaining, so this fails fast below 12 GiB instead.
      - name: Free runner disk space
        env:
          MIN_FREE_GB: "12"
        run: bash scripts/ci-free-runner-disk.sh

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # modules-2 + wrapper only. Caching all of ~/.gradle/caches also pulls in
      # transforms/ and build-cache/, which are several GB, machine-specific,
      # and the usual reason cache.tzst fills the disk.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('app.config.ts', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: Install Node dependencies
        run: npm ci

      - name: Create production env file for native build
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets[format('EXPO_PUBLIC_SENTRY_DSN_{0}', matrix.app.key)] }}
          SENTRY_PROJECT: ${{ secrets[format('SENTRY_PROJECT_{0}', matrix.app.key)] }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_ENABLE_THEME_SWITCH: ${{ secrets.EXPO_PUBLIC_ENABLE_THEME_SWITCH }}
          APP_KEY: ${{ matrix.app.key }}
        run: |
          cat > .env.prod <<EOF
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_SENTRY_DSN_${APP_KEY}=${EXPO_PUBLIC_SENTRY_DSN}
          SENTRY_PROJECT_${APP_KEY}=${SENTRY_PROJECT}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          EXPO_PUBLIC_ENABLE_THEME_SWITCH=${EXPO_PUBLIC_ENABLE_THEME_SWITCH}
          EOF

      # Play's own history is the only durable record of which versionCode has
      # shipped, so it — not a local counter — sets the floor for this build.
      - name: Get current Play Store version code — ${{ matrix.app.route }}
        env:
          PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
          ROUTE: ${{ matrix.app.route }}
          TRACK: ${{ inputs.track }}
        run: |
          version_code="$(node scripts/get-play-version-code.mjs "com.stuqet.${ROUTE}" "$TRACK")"
          echo "Highest existing Play Console versionCode for com.stuqet.${ROUTE}: $version_code"
          echo "PLAY_MAX_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Record runner resources
        id: runner_resources
        run: |
          {
            echo "cpu_cores=$(nproc)"
            echo "memory_total=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "disk_available=$(df -h / | awk 'NR==2 {print $4}')"
          } >> "$GITHUB_OUTPUT"

      - name: Build production AAB — ${{ matrix.app.route }}
        id: build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets[format('ANDROID_UPLOAD_KEYSTORE_BASE64_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets[format('ANDROID_UPLOAD_STORE_PASSWORD_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets[format('ANDROID_UPLOAD_KEY_ALIAS_{0}', matrix.app.key)] }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets[format('ANDROID_UPLOAD_KEY_PASSWORD_{0}', matrix.app.key)] }}
          ROUTE: ${{ matrix.app.route }}
        run: |
          keystore_path="$RUNNER_TEMP/stuqet-${ROUTE}-upload-key.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          ANDROID_UPLOAD_KEYSTORE_FILE="$keystore_path" \
          /usr/bin/time -v -o build-time.txt node scripts/build-android.mjs "$ROUTE" aab

          cat build-time.txt

          elapsed="$(awk -F': ' '/Elapsed \(wall clock\) time/ {print $2}' build-time.txt)"
          max_rss_kb="$(awk -F': ' '/Maximum resident set size/ {print $2}' build-time.txt)"
          max_rss_mib="$(awk -v kb="$max_rss_kb" 'BEGIN {printf "%.0fMiB", kb / 1024}')"

          {
            echo "elapsed=${elapsed:-unavailable}"
            echo "max_rss=${max_rss_mib:-unavailable}"
          } >> "$GITHUB_OUTPUT"

      - name: Locate AAB output
        id: aab
        env:
          ROUTE: ${{ matrix.app.route }}
        run: |
          aab_path="$(find local-builds/android -type f -name "stuqet-${ROUTE}-production-*.aab" | sort | tail -n 1)"

          if [[ -z "$aab_path" ]]; then
            echo "::error::Could not find the ${ROUTE} AAB output."
            find local-builds/android -type f -name '*.aab' -print
            exit 1
          fi

          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      # Kept briefly in case the Play publish step fails partway, so the exact
      # bundle can be re-uploaded without a full rebuild. With skip_publish it
      # is the whole point of the run, and is kept for the full retention.
      - name: Upload AAB artifact to GitHub
        id: upload_aab
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "stuqet-${{ matrix.app.route }}-${{ inputs.track }}-aab-${{ github.sha }}"
          path: ${{ steps.aab.outputs.aab_path }}
          retention-days: 7

      - name: Publish to Google Play — ${{ matrix.app.route }} (${{ inputs.track }})
        if: ${{ inputs.skip_publish != true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_PUBLISHER_SERVICE_ACCOUNT_JSON }}
          packageName: com.stuqet.${{ matrix.app.route }}
          releaseFiles: ${{ steps.aab.outputs.aab_path }}
          tracks: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: docs/releases/${{ matrix.app.route }}/

      # Only the production track feeds the in-app force-update check: an
      # internal/alpha/beta build is not what store users install, so posting
      # its number would prompt them to update to a build they cannot get.
      # A no-op when APP_VERSION_PUBLISH_KEY is unset; see docs/dev.md.
      - name: Publish build number to backend — ${{ matrix.app.route }}
        if: ${{ inputs.skip_publish != true && inputs.track == 'production' }}
        env:
          APP_VERSION_PUBLISH_KEY: ${{ secrets.APP_VERSION_PUBLISH_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          ROUTE: ${{ matrix.app.route }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: node scripts/publish-app-version.mjs "$ROUTE" android "$VERSION_CODE"

      - name: Delete AAB artifact after successful publish
        if: ${{ inputs.skip_publish != true && steps.upload_aab.outputs.artifact-id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.upload_aab.outputs.artifact-id }}" || true

      # continue-on-error on all three: a Discord webhook hiccup must never be
      # able to fail a release that already published. Each matrix leg posts
      # its own result, so there is nothing to relay between jobs.
      - name: Notify Discord — published
        if: ${{ success() && inputs.skip_publish != true }}
        continue-on-error: true
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          NOTIFY_MODE: success
          IS_PREFLIGHT: "false"
          ROUTE: ${{ matrix.app.route }}
          TRACK: ${{ inputs.track }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_URL: ""
          SHORT_SHA: ${{ github.sha }}
          ELAPSED: ${{ steps.build.outputs.elapsed }}
          MAX_RSS: ${{ steps.build.outputs.max_rss }}
          CPU_CORES: ${{ steps.runner_resources.outputs.cpu_cores }}
          MEMORY_TOTAL: ${{ steps.runner_resources.outputs.memory_total }}
          DISK_AVAILABLE: ${{ steps.runner_resources.outputs.disk_available }}
        run: python3 scripts/notify-release-discord.py

      - name: Notify Discord — failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          NOTIFY_MODE: failure
          IS_PREFLIGHT: "false"
          ROUTE: ${{ matrix.app.route }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_URL: ""
          SHORT_SHA: ${{ github.sha }}
        run: python3 scripts/notify-release-discord.py

      # A deliberately cancelled leg is not a failure — treating it as one
      # reads as "something broke" when nothing did.
      - name: Notify Discord — cancelled
        if: cancelled()
        continue-on-error: true
        env:
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          NOTIFY_MODE: cancelled
          ROUTE: ${{ matrix.app.route }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_URL: ""
          SHORT_SHA: ${{ github.sha }}
        run: python3 scripts/notify-release-discord.py

      - name: Trim Gradle cache before post-job save
        if: always()
        continue-on-error: true
        run: bash scripts/ci-trim-gradle-cache.sh
