name: Release gate — merge notice

# Merging a release-request PR does nothing. The publish path is reachable
# only from handle-release-approval.yml, which fires on pull_request_review
# -- so a merge runs no workflow at all, and a workflow that doesn't run
# can't tell you that nothing happened. That silence is the whole problem
# this file exists to fix: a request was merged in good faith, no release
# came out, and there was no message anywhere explaining why.
#
# This is a notice only. It publishes nothing, approves nothing, and has no
# write access to anything but PR comments -- the gate's security properties
# are untouched. It only closes the feedback gap.
on:
  pull_request:
    types: [closed]
    branches:
      - release-gate

permissions:
  pull-requests: write

jobs:
  merge-notice:
    name: Explain that merging does not publish
    # Only bot-opened release-request PRs that were actually merged. A
    # closed-without-merge PR is the normal way to decline a request and
    # needs no comment.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release-request/')
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
      - name: Comment that nothing was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "ℹ️ **Nothing was published.** @$MERGED_BY merged this release request, but merging is not what releases an app.

          Approving this PR is what triggers the real build and Play Store publish via \`handle-release-approval.yml\`. Denying or ignoring it means nothing ships. Merging only folds the request file into \`release-gate\`.

          To actually release, raise a fresh request — run **Request Android Release** — and have an authorized approver (anyone in \`.github/CODEOWNERS\` other than the requester) approve that PR rather than merge it."
